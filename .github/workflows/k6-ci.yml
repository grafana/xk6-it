name: k6 CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: grafana/k6-ci/.github/workflows/all.yml@41aaf8e365b56fd120b0396beae2eba3969babab # v0.5.1
    with:
      k6-ci-ref: 41aaf8e365b56fd120b0396beae2eba3969babab # v0.5.1

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Resolve Go versions
        id: go-versions
        uses: grafana/k6-ci/.github/actions/go-versions@41aaf8e365b56fd120b0396beae2eba3969babab # v0.5.1
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: ${{ steps.go-versions.outputs.current }}
          cache: false
          check-latest: true
      - name: Setup Bats
        uses: bats-core/bats-action@77d6fb60505b4d0d1d73e48bd035b55074bbfb43 # v4.0.0
        with:
          bats-version: "1.14.0"
          support-install: false
          assert-install: false
          detik-install: false
          file-install: false
      - name: Install xk6
        run: go install go.k6.io/xk6/cmd/xk6@master
      - name: Verify fixture module dependencies
        run: |
          for module in ext/*; do
            if [ ! -f "${module}/go.mod" ]; then
              continue
            fi
            (
              cd "${module}"
              go mod tidy
              git diff --exit-code -- go.mod go.sum
              go mod verify
            )
          done
      - name: Run xk6 integration tests
        run: bats test
      - name: Test fixture extensions
        run: bats -r ext
